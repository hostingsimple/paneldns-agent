options {
	directory "/etc/bind";
	check-names primary fail;
};
acl internal-nets { 192.0.2.0/24; 2001:db8::/32; };

view "internal" {
	match-clients { internal-nets; };
	recursion yes;
	zone "example.com" { type master; file "internal/example.com.db"; };
	zone "intranet.example.com" { type master; file "internal/intranet.example.com.db"; };
	zone "both.example.net" { type master; file "internal/both.example.net.db"; };
};

view "public" {
	match-clients { !internal-nets; any; };
	check-names master ignore;
	zone "example.com" { type master; file "public/example.com.db"; };
	zone "both.example.net" { type master; file "public/both.example.net.db"; check-names warn; };
	zone "pubsecondary.example.net" { type secondary; primaries { 192.0.2.2; }; file "s.db"; };
};

view "external" {
	match-clients { any; };
	zone "only-external.example.com" { type master; file "ext/only-external.example.com.db"; };
};
