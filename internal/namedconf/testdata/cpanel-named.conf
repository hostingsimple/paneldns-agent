// cPanel-style named.conf with every comment style.
# hash comment
/* block comment
   spanning lines; with "quotes" and { braces } */
include "/etc/rndc.key";

controls {
	inet 127.0.0.1 port 953 allow { 127.0.0.1; } keys { "rndc-key"; };
};

options {
	directory "/var/named";   // relative zone files resolve here
	dump-file "/var/named/data/cache_dump.db";
	pid-file "/run/named/named.pid";
	allow-transfer { none; };
	listen-on-v6 { ::1; };
	check-names master warn;
	recursion no;
};

logging { channel default_debug { file "data/named.run"; severity dynamic; }; };

zone "." IN {
	type hint;
	file "root.hints";
};

zone "localhost" IN { type master; file "named.localhost"; allow-update { none; }; };
zone "0.0.127.in-addr.arpa" { type master; file "named.loopback"; };

zone "example.com" {
	type master;
	file "/var/named/example.com.db";
};

zone "Example.NET." IN {
	type primary;
	file "example.net.db";
	check-names ignore;
	check-integrity no;
};

zone "secondary.example.com" {
	type slave;
	masters { 192.0.2.53; };
	file "slaves/secondary.example.com.db";
};

zone "fwd.example.com" { type forward; forwarders { 192.0.2.1; }; };
zone "nofile.example.com" { type master; database "dlz"; };

include "/etc/named.conf.zones";
include "/etc/named.d/*.conf";
