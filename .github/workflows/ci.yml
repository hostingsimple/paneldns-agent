name: ci

on:
  push:
    branches: [main]
  pull_request:

# Least privilege: nothing at the top, read-only contents per job.
permissions: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  STATICCHECK_VERSION: v0.8.2
  GOVULNCHECK_VERSION: v1.10.0

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
          cache: false
      - name: gofmt
        run: |
          out="$(gofmt -l .)"
          if [ -n "$out" ]; then echo "gofmt needed:"; echo "$out"; exit 1; fi
      - name: go vet
        run: |
          go vet ./...
          go vet -tags integration ./...
      - name: staticcheck
        run: go run "honnef.co/go/tools/cmd/staticcheck@${STATICCHECK_VERSION}" ./...
      - name: workflow rules (pinned actions, permissions, triggers)
        run: go run ./tools/repocheck workflows

  test:
    name: unit tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
          cache: false
      - name: go test
        run: go test -race -count=1 ./...
      - name: cross-compile linux/amd64 and linux/arm64
        run: |
          for arch in amd64 arm64; do
            CGO_ENABLED=0 GOOS=linux GOARCH="$arch" go build -trimpath -o /dev/null ./cmd/paneldns-agent
          done

  govulncheck:
    name: govulncheck
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
          cache: false
      - name: govulncheck
        run: go run "golang.org/x/vuln/cmd/govulncheck@${GOVULNCHECK_VERSION}" ./...

  reproducible:
    name: reproducible build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
          cache: false
      - name: build twice in different directories and compare
        run: |
          set -eu
          build() { # $1 = source copy, $2 = arch
            ( cd "$1" && CGO_ENABLED=0 GOOS=linux GOARCH="$2" GOCACHE="$1.cache" \
                go build -trimpath -ldflags "-s -w -buildid= -X github.com/hostingsimple/paneldns-agent/internal/version.Version=0.0.0-ci" \
                -o "$1.$2" ./cmd/paneldns-agent )
          }
          for d in "$RUNNER_TEMP/a" "$RUNNER_TEMP/b-elsewhere"; do
            mkdir -p "$d" && cp -a . "$d"
          done
          for arch in amd64 arm64; do
            build "$RUNNER_TEMP/a" "$arch"
            build "$RUNNER_TEMP/b-elsewhere" "$arch"
            sha256sum "$RUNNER_TEMP/a.$arch" "$RUNNER_TEMP/b-elsewhere.$arch"
            cmp "$RUNNER_TEMP/a.$arch" "$RUNNER_TEMP/b-elsewhere.$arch"
          done

  testdata:
    name: documentation names only in testdata
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
          cache: false
      - name: scan testdata/
        run: go run ./tools/repocheck testdata
      - name: shared fixtures and SHA256SUMS up to date
        run: go test -count=1 ./internal/fixtures

  packages:
    name: packages (snapshot build and install test)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      # Pinned by the digest of each multi-arch index (registry-1.docker.io).
      DEBIAN_IMAGE: debian:13@sha256:9c6e381421d0f48d1b8133e573f33c185ee16cbf505eda9c4a8a4791b25ea8a6
      UBUNTU_IMAGE: ubuntu:24.04@sha256:9c7f200c07e3d4a03e7249d2c16bf66a51120fb876aa2242cf31451412543289
      ALMA_IMAGE: almalinux:9@sha256:02df05719ef287ebd0df0a1eedb9172a00bd70703aed7b25660e426b8e0d6047
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
          cache: false
      - name: shell scripts parse as POSIX sh
        run: |
          for f in packaging/scripts/*.sh packaging/repo/publish.sh packaging/install.sh packaging/ci/*.sh; do
            sh -n "$f"
          done
      - name: install GoReleaser (pinned, checksum verified)
        run: sh packaging/ci/install-goreleaser.sh "$RUNNER_TEMP/bin"
      - name: snapshot build (no signing, no publishing)
        run: |
          "$RUNNER_TEMP/bin/goreleaser" check
          "$RUNNER_TEMP/bin/goreleaser" release --snapshot --clean --skip=publish
          ls -l dist
      - name: the packaged binary is the reproducible build
        run: |
          version="$(jq -r .version dist/metadata.json)"
          for arch in amd64 arm64; do
            CGO_ENABLED=0 GOOS=linux GOARCH="$arch" go build -trimpath \
              -ldflags "-s -w -buildid= -X github.com/hostingsimple/paneldns-agent/internal/version.Version=$version" \
              -o "$RUNNER_TEMP/plain.$arch" ./cmd/paneldns-agent
            built="$(find dist -path "*linux_${arch}*" -name paneldns-agent -type f | head -n 1)"
            cmp "$RUNNER_TEMP/plain.$arch" "$built"
          done
      - name: install, upgrade and remove on Debian, Ubuntu and AlmaLinux
        run: |
          set -eu
          run() { docker run --rm -v "$PWD/dist:/dist:ro" -v "$PWD/packaging/ci:/ci:ro" "$1" sh /ci/test-package.sh "$2" /dist; }
          run "$DEBIAN_IMAGE" deb
          run "$UBUNTU_IMAGE" deb
          run "$ALMA_IMAGE" rpm
      - name: the installed systemd unit verifies
        run: |
          set -eu
          sudo dpkg -i dist/paneldns-agent_*_amd64.deb
          systemd-analyze verify /usr/lib/systemd/system/paneldns-agent.service \
            /usr/lib/systemd/system/paneldns-agent-acl.path /usr/lib/systemd/system/paneldns-agent-acl.service
          systemd-analyze security paneldns-agent.service --no-pager || true
          systemd-analyze security paneldns-agent-acl.service --no-pager || true
          sudo dpkg -r paneldns-agent
