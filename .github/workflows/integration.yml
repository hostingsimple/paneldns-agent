name: integration

# Container tests against real software (spec 17): named and
# named-compilezone from the distribution's BIND 9 packages, PowerDNS as a
# service container, and file access through ACLs only.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions: {}

concurrency:
  group: integration-${{ github.ref }}
  cancel-in-progress: true

jobs:
  integration:
    name: BIND and PowerDNS
    runs-on: ubuntu-latest
    permissions:
      contents: read
    services:
      pdns:
        # The image and version the PanelDNS app's DNS integration suite
        # uses (docker/ci/dns-integration/run.sh), pinned by the digest of
        # its multi-arch index. The image's startup script writes the API
        # and webserver settings to pdns.d/_api.conf from PDNS_AUTH_API_KEY,
        # as in the app's suite.
        image: powerdns/pdns-auth-51:5.1.5@sha256:77ff4efdbb9ec30e9309c8a1cbed6121a67fa3be25c848bbbfa756fc75bf9a27
        env:
          PDNS_AUTH_API_KEY: test-only-key
        ports:
          - 127.0.0.1:8081:8081
    env:
      PDNS_TEST_URL: http://127.0.0.1:8081
      PDNS_TEST_KEY: test-only-key
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
          cache: false

      - name: install BIND 9 and acl
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends bind9 bind9-utils bind9-dnsutils acl
          sudo systemctl stop named || sudo systemctl stop bind9 || true
          # Ubuntu's AppArmor profile confines named to /etc/bind and
          # /var/cache/bind; the test runs its own named in a temp dir.
          if [ -f /etc/apparmor.d/usr.sbin.named ]; then
            sudo apparmor_parser -R /etc/apparmor.d/usr.sbin.named || true
          fi
          named -v
          named-compilezone -v || true

      - name: wait for PowerDNS
        run: |
          for i in $(seq 1 30); do
            if curl -fsS -H "X-API-Key: $PDNS_TEST_KEY" "$PDNS_TEST_URL/api/v1/servers/localhost" >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          echo "PowerDNS API did not come up"; exit 1

      - name: readers against named-compilezone, named and PowerDNS
        run: go test -tags integration -count=1 -v ./internal/integration/

      - name: zone access through ACLs only (rndc key unreadable)
        run: |
          set -eu
          go test -c -tags integration -o "$RUNNER_TEMP/integration.test" ./internal/integration/
          go build -o "$RUNNER_TEMP/aclplan" ./tools/aclplan
          sudo install -m 0755 "$RUNNER_TEMP/integration.test" /usr/local/bin/paneldns-integration.test
          sudo install -m 0755 "$RUNNER_TEMP/aclplan" /usr/local/bin/paneldns-aclplan
          sudo useradd --system --no-create-home --shell /usr/sbin/nologin paneldns-agent
          sudo mkdir -p /srv/acl/inc /srv/acl/keys
          sed 's#@DIR@#/srv/acl#g' internal/integration/testdata/named.conf.in | sudo tee /srv/acl/named.conf >/dev/null
          sudo cp internal/integration/testdata/*.db internal/integration/testdata/rndc.key /srv/acl/
          sudo cp internal/integration/testdata/inc/www.db /srv/acl/inc/
          sudo chown -R root:root /srv/acl
          sudo chmod 0750 /srv/acl /srv/acl/inc /srv/acl/keys
          sudo find /srv/acl -type f -exec chmod 0640 {} +
          sudo chmod 0600 /srv/acl/rndc.key
          printf 'PANELDNS_URL=https://app.example.com\nZONES_FILE=/srv/acl/named.conf\n' | sudo tee /srv/acl/paneldns-agent.conf >/dev/null
          sudo paneldns-aclplan /srv/acl/paneldns-agent.conf | tee "$RUNNER_TEMP/acl.sh"
          sudo sh -x "$RUNNER_TEMP/acl.sh"
          getfacl -R /srv/acl 2>/dev/null | head -60 || true
          cd /
          sudo -u paneldns-agent env PANELDNS_ACL_TEST_CONF=/srv/acl/named.conf /usr/local/bin/paneldns-integration.test -test.run TestACLAccess -test.v

      # cPanel creates new zone files with mode 0600: the inherited
      # u:paneldns-agent:r entry lands with mask::---, so the agent can't read
      # them (DECISIONS D-30). Reproduce that, then let fix-acls repair it.
      - name: fix-acls restores read on a new 0600 zone file
        run: |
          set -euo pipefail
          CGO_ENABLED=0 go build -trimpath -o "$RUNNER_TEMP/paneldns-agent" ./cmd/paneldns-agent
          sudo install -m 0755 "$RUNNER_TEMP/paneldns-agent" /usr/bin/paneldns-agent
          . packaging/ci/acl-addzone.sh
          addzone new1.example.org
          sudo getfacl -c /srv/acl/new1.example.org.db
          hasacl /srv/acl/new1.example.org.db 'mask::---'
          if sudo -u paneldns-agent cat /srv/acl/new1.example.org.db >/dev/null 2>&1; then
            echo "the agent can read the 0600 file before fix-acls: the test doesn't reproduce the finding"; exit 1
          fi
          sudo paneldns-agent fix-acls --config /srv/acl/paneldns-agent.conf | tee "$RUNNER_TEMP/fix1.txt"
          grep -q '^fix-acls: 1 fixed (/srv/acl/new1.example.org.db)' "$RUNNER_TEMP/fix1.txt"
          sudo getfacl -c /srv/acl/new1.example.org.db
          sudo -u paneldns-agent cat /srv/acl/new1.example.org.db >/dev/null
          # The mask gained read for the agent; the owning group gained nothing.
          hasacl /srv/acl/new1.example.org.db 'mask::r--'
          hasacl /srv/acl/new1.example.org.db 'group::---'
          sudo paneldns-agent fix-acls --config /srv/acl/paneldns-agent.conf | tee "$RUNNER_TEMP/fix2.txt"
          grep -q '^fix-acls: 0 fixed' "$RUNNER_TEMP/fix2.txt"
          if sudo -u paneldns-agent cat /srv/acl/rndc.key >/dev/null 2>&1; then
            echo "the agent can read rndc.key"; exit 1
          fi

      - name: the ACL watcher units fix new and replaced files by themselves
        run: |
          set -euo pipefail
          . packaging/ci/acl-addzone.sh
          sudo install -m 0644 packaging/systemd/paneldns-agent-acl.path packaging/systemd/paneldns-agent-acl.service /usr/lib/systemd/system/
          sudo install -m 0640 -o root -g "$(id -gn paneldns-agent)" /srv/acl/paneldns-agent.conf /etc/paneldns-agent.conf
          sudo systemd-analyze verify /usr/lib/systemd/system/paneldns-agent-acl.path /usr/lib/systemd/system/paneldns-agent-acl.service
          # By hand, fix-acls writes the watch list and reloads systemd.
          sudo paneldns-agent fix-acls
          cat /etc/systemd/system/paneldns-agent-acl.path.d/watch.conf /etc/systemd/system/paneldns-agent-acl.service.d/watch.conf
          grep -qx 'PathChanged=/srv/acl' /etc/systemd/system/paneldns-agent-acl.path.d/watch.conf
          sudo systemctl enable --now paneldns-agent-acl.path
          systemctl status paneldns-agent-acl.path --no-pager
          readable() { # $1 = file; waits up to 30s for the agent to read it
            for _ in $(seq 1 30); do
              if sudo -u paneldns-agent cat "$1" >/dev/null 2>&1; then return 0; fi
              sleep 1
            done
            sudo getfacl "$1" || true
            sudo journalctl -u paneldns-agent-acl.service --no-pager | tail -40
            echo "the watcher did not restore read on $1"; return 1
          }
          addzone new2.example.org
          readable /srv/acl/new2.example.org.db
          hasacl /srv/acl/new2.example.org.db 'mask::r--'
          # A file replaced by a new inode (as cPanel's rebuilddnsconfig does
          # with named.conf) loses its ACL; the watcher restores it.
          sudo cp /srv/acl/named.conf /srv/acl/named.conf.new
          sudo setfacl -b /srv/acl/named.conf.new
          sudo chmod 0600 /srv/acl/named.conf.new
          sudo mv /srv/acl/named.conf.new /srv/acl/named.conf
          readable /srv/acl/named.conf
          sleep 8 # let the watcher's follow-up run finish
          sudo journalctl -u paneldns-agent-acl.service --no-pager | tail -20
          systemctl is-active paneldns-agent-acl.path
          systemctl is-enabled paneldns-agent-acl.path
          if sudo -u paneldns-agent cat /srv/acl/rndc.key >/dev/null 2>&1; then
            echo "the agent can read rndc.key"; exit 1
          fi
          systemd-analyze security paneldns-agent-acl.service --no-pager || true
          cd /
          sudo -u paneldns-agent env PANELDNS_ACL_TEST_CONF=/srv/acl/named.conf /usr/local/bin/paneldns-integration.test -test.run TestACLAccess -test.v
