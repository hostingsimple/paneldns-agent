# /etc/paneldns-agent.conf: PanelDNS agent configuration (Panel Sync).
#
# Mode 0640, owner root, group paneldns-agent. This file holds no secret:
# the agent's private key lives in /var/lib/paneldns-agent/.
# `paneldns-agent enrol` fills in the detected values. Every value can be
# changed by hand; package upgrades keep your edits.
# Run `paneldns-agent --check` after any change.

PANELDNS_URL=https://app.paneldns.example   # HTTPS only
INTERVAL=60                                 # seconds between change scans; minimum 15
RESYNC=21600                                # seconds between full inventories
LOG_LEVEL=info                              # error | warn | info | debug
ZONE_SOURCE=bind                            # bind | powerdns-api | pdnsutil (detected at enrol)
ZONES_FILE=/etc/named.conf                  # bind: the named.conf to read (detected)
CHROOT=                                     # bind: e.g. /var/named/run-root for a chrooted named
VIEW=                                       # bind: the one view to read; empty = the default/external view
PDNS_API_URL=http://127.0.0.1:8081          # powerdns-api: loopback only
PDNS_API_KEY_FILE=/var/lib/paneldns-agent/pdns-api-key   # powerdns-api: copied from pdns.conf at enrol (0600)
OWNERS_FILE=/etc/userdomains                # panel owner map (detected); empty = no owners
EXCLUDE=*.local server-hostname.example.net # local excludes; reported as excluded, never omitted
